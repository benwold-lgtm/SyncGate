apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-mcp-gateway
  labels:
    app.kubernetes.io/name: device-mcp-gateway
spec:
  # Gateway is stateless in distributed mode — scale freely.
  # Set registry.mode = "distributed" in configmap.yaml to enable.
  # 2 replicas matches the HPA's minReplicas (hpa.yaml) and gives the PDB
  # (minAvailable: 1) headroom to allow rolling updates / node drains.
  # In EMBEDDED mode set this to 1 (in-process pods, no shared state) and
  # remove the gateway HPA, which would otherwise scale you past a single owner.
  replicas: 2
  selector:
    matchLabels:
      app: device-mcp-gateway
  template:
    metadata:
      labels:
        app: device-mcp-gateway
      annotations:
        # Prometheus scrapes the dedicated metrics port, not the API port (8000).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      # Give SSE streams time to drain before the pod is forcibly killed.
      # Adjust upward if clients hold very long-lived connections.
      terminationGracePeriodSeconds: 120
      # Spread replicas across nodes so a single node failure can't take out the
      # whole gateway tier (and so the PDB's minAvailable: 1 is actually meaningful).
      # "preferred" — won't block scheduling on a small/single-node test cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: device-mcp-gateway
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Required to read the credentials volume: the Secret is root-owned, so the
        # workload reaches it through the group bit or not at all (measured).
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Immutable digest pin. The digest — not the tag — is what Kubernetes resolves,
          # so every replica on every node runs byte-identical bits, and a re-pushed tag
          # cannot silently change what is deployed. The :0.2.0 tag is kept alongside it
          # purely as a human-readable label; the digest wins.
          #
          # To upgrade, change BOTH here and in worker-deployment.yaml (or override once
          # via the `images:` block in kustomization.yaml). Read a digest with:
          #   docker buildx imagetools inspect ghcr.io/benwold-lgtm/device-mcp-gateway:<tag>
          #
          # Using a MOVING tag instead (:latest) requires imagePullPolicy: Always —
          # with IfNotPresent a node keeps running whatever it cached, indefinitely.
          image: ghcr.io/benwold-lgtm/device-mcp-gateway:0.3.8@sha256:e752997a044b5a8ac1c926fb6c7ca921125331b836ed2bc9e94e124b540c9085
          # Correct for a digest/immutable tag: the bits can't change under a fixed digest,
          # so re-pulling would be pure overhead.
          imagePullPolicy: IfNotPresent
          # Container hardening. readOnlyRootFilesystem is safe because the
          # distributed-mode gateway writes only to /app/logs (mounted as an
          # emptyDir below); SQLite/`/app/data` is embedded-mode only.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            # Root of the credential store. Safe to set unconditionally: the resolver is
            # built only when a device or a gateway.rbac entry actually holds a secret://
            # reference, so an empty mount here costs nothing.
            - name: MCP_CREDENTIAL_ROOT
              value: /run/secrets/mcp
            - name: MCP_CONFIG
              value: /app/config.yaml
            - name: MCP_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: api-key
                  optional: true
            - name: MCP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: secret-key
                  optional: true
            # Break-glass RBAC role keys. `optional: true` so a stack running purely on
            # OIDC (ADR-0007) needs no static keys at all — but note the gateway warns
            # when OIDC is enabled with no break-glass key, because an IdP outage then
            # locks you out of your own gateway.
            #
            # ⚠️ Secret keys here are the lowercase-hyphenated Secret KEY names, not the
            # env var names. `key: MCP_ADMIN_KEY` returns an empty string, which base64
            # decodes happily and produces a `Bearer ` with no token — presenting as a
            # 401 rather than as a manifest error.
            - name: MCP_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: admin-key
                  optional: true
            - name: MCP_VIEWER_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: viewer-key
                  optional: true
            # SSRF policy override (F-02). "false" here is a no-op that matches the
            # config default — `resolve_allow_private` ORs config with this env var, so
            # setting it false does NOT switch off `security.allow_private_targets: true`
            # in the ConfigMap. It is declared so the knob is visible in the manifest
            # rather than being a setting you have to already know exists.
            #
            # ⚠️ Set "true" if your devices live on private addresses — which is the
            # normal case for a cluster-internal or LAN fleet. Without it, registration
            # fails with "resolves to a blocked address", which is correct behaviour and
            # reads exactly like a bug. Set it on the WORKER too: in distributed mode the
            # worker performs the fetch.
            - name: MCP_ALLOW_PRIVATE_TARGETS
              value: "false"
            # Authenticated Redis URL incl. password (Tier-0 F-24), e.g.
            # redis://:<password>@redis:6379/0 (or rediss://… for TLS). Kept in the
            # secret so the password isn't in the manifest. The gateway refuses to
            # start against an unauthenticated Redis unless redis.allow_insecure: true.
            - name: MCP_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: redis-url
            - name: GATEWAY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            # Credential store (ADR-0018). Empty when the Secret is absent, which is the
            # supported default — see the volume definition below.
            - name: credentials
              mountPath: /run/secrets/mcp
              readOnly: true
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            # Writable log dir — required because the root filesystem is read-only.
            # emptyDir is ephemeral (lost on restart); ship logs to a collector
            # (see docs/observability.md) for durability.
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness uses /livez (F-17): a no-I/O check that the event loop is
          # turning. /health does Redis/registry work (it's really readiness) and a
          # gateway whose loop is wedged can keep serving cached responses — /livez
          # catches that "wedged-but-serving" case; a wedged loop also can't answer
          # the probe, so it fails either way. Restart the pod on a stalled loop.
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: credentials
          # ADR-0018 credential store, and from ADR-0023 slice 4 the home of any
          # `gateway.rbac` entry whose key is held by reference.
          #
          # **A `projected` volume with one source per Secret, not one Secret holding
          # everything.** ADR-0023 property 1 requires a break-glass credential to be
          # delivered as an *individual* Kubernetes Secret whose RoleBindings grant exactly
          # one subject read access, checked as a pipeline step rather than trusted to a
          # runbook line. One Secret has one ACL, so packing every credential into a single
          # `gateway-credentials` Secret makes that custody property unachievable. Projected
          # sources keep per-Secret RBAC while still presenting a single mount.
          #
          # The resolver reads `<root>/<namespace>/<path...>/<key>`, so each source's
          # `items[].path` IS what the `secret://` reference resolves to — always at least
          # three components, which is why a flat mount cannot serve one.
          projected:
            # ⚠️ 0440, and `fsGroup` below, are load-bearing and were measured on a live
            # cluster, not chosen. A Kubernetes Secret volume is ROOT-OWNED and cannot be
            # chowned to the workload, so a non-root pod reaches it only as group or as
            # world. The resolver refuses world-readable credentials outright, so 0444 fails
            # closed and 0400 is simply unreadable by uid 1000. Group is the only door.
            defaultMode: 0440
            sources:
              # Every source is `optional: true`, so a stack using none of them still starts —
              # the resolver is built only when something actually holds a reference.
              #
              # The console's own gateway token (ADR-0023 slice 4). Uncomment together with
              # the `bff-password-sessions` entry in configmap.yaml.
              # - secret:
              #     name: gateway-credentials
              #     optional: true
              #     items:
              #       - key: bff-token
              #         path: console/bff/token
              #
              # One Secret per authorized person — the shape property 1 requires.
              # - secret:
              #     name: break-glass-alice
              #     optional: true
              #     items:
              #       - key: key
              #         path: <tenant>/break-glass/alice/key
              #
              # One Secret per device credential (ADR-0018).
              # - secret:
              #     name: device-cred-example
              #     optional: true
              #     items:
              #       - key: api-key
              #         path: <tenant>/devices/example/api-key
              #
              # A projected volume needs at least one source, so this keeps the manifest
              # valid until a real credential is added. With the Secret absent it projects
              # nothing and the mount is empty.
              - secret:
                  name: gateway-credentials
                  optional: true
        - name: config
          configMap:
            name: gateway-config
        - name: logs
          emptyDir: {}
