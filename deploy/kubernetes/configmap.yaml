apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    app.kubernetes.io/name: device-mcp-gateway
data:
  config.yaml: |
    # Device MCP Gateway Configuration
    # Secrets (api_key, secret_key) are injected via the gateway-secrets Secret;
    # do not store them here.

    gateway:
      api_key: ""      # set via MCP_GATEWAY_API_KEY env var
      secret_key: ""   # set via MCP_SECRET_KEY env var
      # This bundle includes an Ingress, so requests reach the gateway via the ingress
      # controller and request.client.host is the controller pod — not the real client.
      # To key rate limits on the client, enable BOTH of these together (the gateway
      # refuses to start with trust on and no trusted_proxy_cidrs, because ingress-nginx
      # APPENDS to X-Forwarded-For and the left-most entry is whatever the client sent):
      # trust_proxy_headers: true

      # --- The console's own gateway identity (ADR-0023 slice 4) -----------------------
      #
      # Uncomment when deploying the UI/BFF. Left commented because the gateway ships and
      # runs standalone, and an entry whose secret:// key cannot be resolved REFUSES TO
      # START — deliberately, so the holder never sees unexplained 401s instead.
      #
      # WHY THE BFF NEEDS ITS OWN ENTRY. When the BFF relays a *password* session it has no
      # per-user token to pass through, so it presents its own configured token. Today that
      # is the stack's admin key, which means every console login authenticates to this
      # gateway as `key:legacy` — and once gateway.api_key becomes break-glass (slice 4),
      # ordinary console traffic would fire a high-severity event and inherit a 90-day
      # expiry on the login path. A named entry of its own is what makes that separable.
      #
      # `role: console` is operator + caller — device management, metrics, tool invocation —
      # and carries NO backup:* scope. The BFF already refuses password sessions on the
      # backup routes because the admin token it proxies with holds every backup scope; this
      # moves that guarantee into the gateway, where a console-side bug cannot undo it.
      #
      # ⚠️ A reference resolves to <root>/<namespace>/<path...>/<key> — ALWAYS at least
      # three path components, so a `--from-literal` Secret mounted flat can NEVER satisfy
      # one. The volume has to project the key to a nested path explicitly:
      #
      #   kubectl create secret generic gateway-credentials -n mcp-gateway \
      #     --from-literal=bff-token="$(openssl rand -hex 32)"
      #
      # then add the projection to the `credentials` volume in deployment.yaml AND
      # worker-deployment.yaml:
      #
      #   - name: credentials
      #     secret:
      #       secretName: gateway-credentials
      #       optional: true
      #       defaultMode: 0440
      #       items:
      #         - key: bff-token
      #           path: console/bff/token     # ← matches secret://console/bff#token
      #
      # Put THE SAME VALUE in the UI's GATEWAY_API_TOKEN (ui-bff-secrets), which is what the
      # BFF presents. Both ends are configured from the one generated value; neither learns
      # it from the other.
      #
      # rbac:
      #   - name: bff-password-sessions
      #     key: "secret://console/bff#token"
      #     role: console

    server:
      host: "0.0.0.0"
      port: 8000

    registry:
      # "distributed" enables Redis-backed shared state, multiple gateway replicas,
      # and separate worker processes. "embedded" is for local dev only (no Redis).
      mode: "distributed"
      health_check_interval: 30
      spec_poll_interval: 300
      spec_cache_ttl: 3600
      max_concurrent_pods: 50

    redis:
      # URL is overridden by MCP_REDIS_URL env var injected in deployment.yaml.
      url: "redis://redis:6379/0"
      socket_timeout: 5
      max_connections: 20

    auth:
      type: "api_key"
      api_key:
        header_name: "X-API-Key"
      oauth2:
        token_endpoint: ""
        client_id: ""
        client_secret: ""
        scopes:
          - "read"
          - "write"

    discovery:
      spec_paths:
        - "/openapi.json"
        - "/openapi.yaml"
        - "/swagger.json"
        - "/swagger.yaml"
        - "/api-docs"
        - "/docs/openapi.json"
        - "/openapi/3.0.json"
        - "/api/v1/openapi.json"
      timeout: 10

    storage:
      type: "sqlite"
      db_path: "/app/data/devices.db"

    cors:
      # Set specific origins for production browser clients; empty disables CORS.
      allowed_origins: []

    # This block is deliberately NOT commented out. It used to be, and that was a trap:
    # an operator adding a key under a commented-out parent produces a file where the
    # parent still does not exist, so the setting silently does nothing and the gateway
    # keeps the default. Keep `security:` present and add keys under it.
    security:
      # SSRF policy (Tier-0 F-02). The gateway fetches base_url/spec_url server-side, so
      # by default it refuses targets resolving to private/loopback/link-local addresses
      # — including cloud metadata at 169.254.169.254.
      #
      # ⚠️ In Kubernetes this default rejects in-cluster upstreams. A device addressed by
      # Service DNS (http://my-device.mcp-gateway.svc.cluster.local) resolves into the
      # service or pod CIDR, which IS private, so registration fails with
      # "resolves to a blocked address" — correct behaviour, surprising the first time.
      # Set true only when your fleet legitimately lives on private addresses, which is
      # the normal case for a cluster-internal deployment.
      # Env override: MCP_ALLOW_PRIVATE_TARGETS=true (set on the worker too — it does the
      # fetching in distributed mode).
      allow_private_targets: false

      # Endpoint fingerprint policy (ADR-0015). "warn" (default) flags a device whose TLS
      # key changed and keeps it serving; "enforce" additionally refuses tool calls and
      # resource reads until an operator approves the new key or removes the device.
      # Overridable per device at registration with `fingerprint_policy`.
      #
      # The pin is the SPKI (public key), not the certificate — so a routine renewal
      # against the same key does NOT alarm. A changed key does, because from the outside
      # that is indistinguishable from a substituted endpoint.
      # fingerprint_policy: "warn"

      # Companion to gateway.trust_proxy_headers above. List the ranges the ingress
      # controller actually connects from — your cluster pod CIDR, plus the service/LB
      # range if traffic traverses one. These are cluster-specific; read them off your
      # cluster rather than copying (kubectl get pod -n ingress-nginx -o wide, or the
      # --cluster-cidr / --service-cluster-ip-range flags on the control plane).
      # Only list infrastructure you control: each range is a hop an attacker no longer
      # has to get past, and 0.0.0.0/0 would restore the spoofing bypass outright.
      # trusted_proxy_cidrs:
      #   - "10.244.0.0/16"   # pod CIDR (kubeadm/flannel default — verify yours)
      #   - "10.96.0.0/12"    # service CIDR (kubeadm default — verify yours)

    logging:
      level: "INFO"
      file: "logs/gateway.log"
      max_size: 50
      backup_count: 5
