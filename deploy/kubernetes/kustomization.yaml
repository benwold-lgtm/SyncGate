apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── The namespace: THE single source of truth ──────────────────────────────────────
# Kustomize's namespace transformer rewrites both the `metadata.namespace` of every
# resource in this bundle AND the name of the Namespace object in namespace.yaml, so
# changing this one line retargets the whole stack. No resource file carries a hardcoded
# namespace any more — do not add one back, or the two will drift.
#
# ⚠️ It does NOT rewrite CRD fields. `namespaceSelector` in servicemonitor.yaml is the
# one that bites; that file omits it deliberately (an omitted selector means "my own
# namespace", which is correct under any name).
#
# Multi-tenant estates: one namespace per tenant, named after the tenant's OPAQUE
# IDENTIFIER rather than the customer — `mcp-t-<16 hex>`, minted with
# `tools/tenant_id.py new`. Deploy each tenant from an overlay that sets this field and the
# `mcp.gateway/tenant` label; see ADR-0019 and docs/multitenancy.md. A namespace name is not
# encrypted, so a customer name here survives the crypto-shred of ADR-0013 §10 and leaks
# into every metric label and dashboard in the estate.
namespace: mcp-gateway

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - configmap.yaml
  - redis.yaml
  - deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa.yaml

# ── The device catalog is NOT here, deliberately ───────────────────────────────────
# It used to be, as "deployment convenience". It now has its own kustomization:
#
#   kubectl apply -k deploy/kubernetes/catalog/
#
# The catalog is a provider-plane object with no tenant reach (ADR-0020 §1) and its own
# component with its own failure domain (§7). This bundle is a TENANT stack, and there is
# one of it per tenant — so bundling gave every tenant a private copy of a store that
# belongs to no tenant, making "which device types exist" have as many answers as there
# were tenants. Applying it here once for a single-tenant install and once more for the
# next tenant is not a duplicate deployment; it is a second catalog.
#
# ⚠️ Do not add it back to make a one-cluster demo simpler. A tenant overlay that has to
# delete six objects to be correct is how the bundling read from the tenant side, and it is
# what a real estate would have inherited.

# Single place to retarget the image for BOTH the gateway and the worker — they must
# stay in lockstep (they share the Redis data model, so a version skew across a schema
# change is a split-brain risk). Uncomment and edit rather than hand-editing two
# manifests, and prefer `digest:` over `newTag:` so what runs can't change under you.
#
# Read the digest for a tag with:
#   docker buildx imagetools inspect ghcr.io/benwold-lgtm/device-mcp-gateway:<tag>
#
# images:
#   - name: ghcr.io/benwold-lgtm/device-mcp-gateway
#     digest: sha256:...                      # preferred: immutable
#     # newTag: "0.3.9"                       # or a semver tag; never :latest in production
#
# Building locally instead (kind/minikube)? Point `newName` at your local image and load
# it into the cluster — `kind load docker-image my-gateway:dev` — since a digest pin will
# not resolve against a locally built image:
#   - name: ghcr.io/benwold-lgtm/device-mcp-gateway
#     newName: my-gateway
#     newTag: dev

# Prometheus Operator resources are NOT applied by default — they require the
# Operator's CRDs (monitoring.coreos.com/v1: PrometheusRule, ServiceMonitor),
# and a `kubectl apply -k` would fail on a cluster without them. If you run the
# Prometheus Operator, uncomment the lines below (or apply the files directly):
#   - prometheus-rules.yaml   # SLO recording + burn-rate alert rules (PrometheusRule)
#   - servicemonitor.yaml     # scrape config for gateway + worker metrics (ServiceMonitor)
# Without the Operator, the pods still expose /metrics on :9100 and carry
# prometheus.io/scrape annotations for annotation-based discovery; lift the
# `groups:` from prometheus-rules.yaml into your prometheus.yml rule_files.
