---
# Worker Deployment — hosts DevicePods and executes tool calls.
# Scale independently of the gateway. Each replica gets a unique WORKER_ID
# via the pod name (injected via the Downward API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-mcp-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: device-mcp-worker
  template:
    metadata:
      labels:
        app: device-mcp-worker
      annotations:
        # Workers expose Prometheus on the dedicated metrics port (the worker
        # HPA's redis-stream-lag signal — mcp_worker_pending_calls — lives here).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      # 120s matches the gateway. Workers make outbound tool calls (15s httpx timeout)
      # and need time to finish in-flight calls, drain the Redis Stream consumer, and
      # unregister from workers:active before the pod is forcibly killed. On
      # SIGTERM the worker stops consuming and drains in-flight tool calls (up to
      # registry.shutdown_drain_timeout) before tearing down pods (SRE #6); keep
      # this grace period comfortably above that drain timeout.
      terminationGracePeriodSeconds: 120
      # Spread workers across nodes so a single node failure drops at most one
      # worker (the PDB keeps minAvailable: 1; surviving workers reclaim the
      # evicted worker's devices via lease lapse + XAUTOCLAIM). "preferred" so it
      # won't block scheduling on a small/single-node test cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: device-mcp-worker
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Required to read the credentials volume (root-owned Secret; group bit or
        # nothing). Same reasoning as deployment.yaml.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Immutable digest pin — keep in lockstep with deployment.yaml. A worker running
          # different bits from the gateway is a split-brain risk: they share the Redis
          # data model, so a version skew across a schema change is exactly what an
          # unpinned :latest used to allow one node at a time to drift into.
          image: ghcr.io/benwold-lgtm/device-mcp-gateway:0.3.9@sha256:dd191bf3c0f5e896ab8a9c244894edca7bb5fa08853bffa54d937d657c7a0b4a
          # Explicit, and matching the gateway. Previously unset, which with :latest meant
          # Kubernetes defaulted this pod to Always while the gateway used IfNotPresent —
          # the two could pull different builds of the same tag.
          imagePullPolicy: IfNotPresent
          command: ["device-mcp-worker"]
          # Container hardening. readOnlyRootFilesystem is safe because the worker
          # writes only to /app/logs and to its liveness file under /tmp — both
          # mounted as emptyDir volumes below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                # Give Kubernetes time to remove this pod from any routing layer
                # before SIGTERM fires, preventing new assignments during shutdown.
                command: ["/bin/sh", "-c", "sleep 5"]
          env:
            - name: MCP_CREDENTIAL_ROOT
              value: /run/secrets/mcp
            - name: MCP_CONFIG
              value: /app/config.yaml
            - name: MCP_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: api-key
                  optional: true
            - name: MCP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: secret-key
                  optional: true
            # ⚠️ MUST match the gateway's value. In distributed mode the WORKER performs
            # the spec fetch, the health check and every tool call, so this is the copy
            # that decides whether a private-addressed device is reachable at all. Set on
            # the gateway alone, registration succeeds and every subsequent call to the
            # device fails — a split that looks like a device fault, not a config one.
            # No RBAC role keys here: the worker serves no API and does no authorization.
            - name: MCP_ALLOW_PRIVATE_TARGETS
              value: "false"
            # Authenticated Redis URL incl. password (Tier-0 F-24) — see deployment.yaml.
            # The worker refuses to start against an unauthenticated Redis unless
            # redis.allow_insecure: true.
            - name: MCP_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: redis-url
            # Use the pod name as WORKER_ID for uniqueness across replicas
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets/mcp
              readOnly: true
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            # Writable log dir (root filesystem is read-only). emptyDir is
            # ephemeral — ship logs to a collector for durability.
            - name: logs
              mountPath: /app/logs
            # Writable /tmp for the liveness file (registry.liveness_file default:
            # <tempdir>/mcp-worker-alive — i.e. /tmp/mcp-worker-alive, which the
            # liveness probe below checks). Required under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Workers have no HTTP port. The heartbeat loop touches a local liveness
          # file (mtime) on every HEALTHY beat and withholds it when its critical
          # loops have stalled, so file freshness mirrors worker liveness (F-17).
          # This replaces the old probe that spawned a Python interpreter AND opened
          # a fresh Redis connection every period, per worker — heavyweight and a
          # failure source of its own under Redis stress. `find -mmin -2` flags the
          # file as fresh only if touched in the last 2 min (> heartbeat interval);
          # a stale or missing file → no match → exit 1 → probe fails.
          # NOTE: the path must match registry.liveness_file (default: the system
          # temp dir + /mcp-worker-alive). Update both together if you override it.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - find /tmp/mcp-worker-alive -mmin -2 | grep -q .
            # Allow time for: process startup + first healthy heartbeat write.
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: credentials
          # ADR-0018 credential store. The WORKER needs this too — in distributed mode it is
          # the worker that resolves a device credential at dispatch, which is why §7b orders
          # workers before the gateway on rollout.
          #
          # Keep `sources` identical to deployment.yaml: a credential projected into only one
          # of the two is a device that resolves on the gateway's path and fails on the
          # worker's, or the reverse. See that file for why this is `projected`.
          projected:
            # ⚠️ 0440, and `fsGroup` below, are load-bearing and were measured on a live
            # cluster, not chosen. A Kubernetes Secret volume is ROOT-OWNED and cannot be
            # chowned to the workload, so a non-root pod reaches it only as group or as
            # world. The resolver refuses world-readable credentials outright, so 0444 fails
            # closed and 0400 is simply unreadable by uid 1000. Group is the only door.
            defaultMode: 0440
            sources:
              # Every source is `optional: true`, so a stack using none of them still starts —
              # the resolver is built only when something actually holds a reference.
              #
              # The console's own gateway token (ADR-0023 slice 4). Uncomment together with
              # the `bff-password-sessions` entry in configmap.yaml.
              # - secret:
              #     name: gateway-credentials
              #     optional: true
              #     items:
              #       - key: bff-token
              #         path: console/bff/token
              #
              # One Secret per authorized person — the shape property 1 requires.
              # - secret:
              #     name: break-glass-alice
              #     optional: true
              #     items:
              #       - key: key
              #         path: <tenant>/break-glass/alice/key
              #
              # One Secret per device credential (ADR-0018).
              # - secret:
              #     name: device-cred-example
              #     optional: true
              #     items:
              #       - key: api-key
              #         path: <tenant>/devices/example/api-key
              #
              # A projected volume needs at least one source, so this keeps the manifest
              # valid until a real credential is added. With the Secret absent it projects
              # nothing and the mount is empty.
              - secret:
                  name: gateway-credentials
                  optional: true
        - name: config
          configMap:
            name: gateway-config
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
