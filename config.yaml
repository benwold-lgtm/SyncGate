# Device MCP Gateway Configuration

gateway:
  # Which tenant this stack serves. One gateway, one tenant (ADR-0004), so it is set once
  # here rather than per issuer. Use the opaque identifier minted by `tools/tenant_id.py new`
  # (ADR-0019) — random, never derived from the customer's name, and never reissued.
  #
  # Read at runtime since ADR-0024 §10: redeeming an enrolment invitation reports this value
  # to the provider, so the provider can check that the catalog credential it minted belongs
  # to the tenant it actually reached. Redemption REFUSES when it is unset, naming this field
  # — a stack that cannot say which tenant it is cannot be enrolled.
  #
  # ⚠️ Beyond that one reader, nothing in the gateway consults it. It used to gate ADR-0013's
  # elevated grants (a grant claim named exactly one tenant and was refused unless it named
  # this one), and ADR-0017 removed that mechanism entirely — `plane`, `grant_claim` and
  # `entitlement_claim` are gone from the code. It is retained as the deployment's own
  # record of which tenant it serves: the same identifier names the namespace, the console
  # subdomain and the provider-side registry entry (ADR-0024 §2), and keeping one value in
  # one place is what stops those three from drifting apart.
  # tenant_id: "t-3f9a1c2b7d4e8065"
  # Require Authorization: Bearer <token> on all API routes (leave empty to disable).
  # Override with MCP_GATEWAY_API_KEY environment variable. This single key maps to
  # the "admin" role (full access) — today's behaviour, unchanged.
  #
  # ⚠️ IF gateway.oidc IS ENABLED, THIS KEY IS BREAK-GLASS (ADR-0023 slice 4). With OIDC on
  # it authenticates only when the JWT path fails or is absent, which is the emergency path
  # whatever field it sits in — so its use emits a high-severity audit record and counts as
  # an activation. With NO OIDC it is the deployment's ordinary everyday credential and
  # nothing about it changes; flagging it there would fire on normal traffic.
  #
  # It has NO NAME and NO 'issued' date, so the audit can say break-glass was used but not
  # BY WHOM, and no expiry applies. Flagging makes it loud; only a named break_glass entry
  # below makes it attributable and expiring. Provision one per person and remove this key —
  # it may stay as a first-deploy bootstrap fallback, not as the steady-state path.
  #
  # ⚠️ If a UI/BFF relays this key for password sessions, give that path its own NAMED,
  # UNFLAGGED entry first (see `console` below), or every console login fires a
  # high-severity event.
  api_key: ""
  # Scoped API keys (RBAC). Each key maps to a role; routes authorize on scopes:
  #   admin  → devices:read, devices:write, tools:call, metrics:read (full access)
  #   viewer → devices:read, metrics:read (read-only; no device mutation or tool calls)
  # `name` becomes the audit-log subject ("key:<name>"). Env shortcuts also exist:
  # MCP_ADMIN_KEY and MCP_VIEWER_KEY. If no keys are set anywhere, auth is disabled.
  # In DISTRIBUTED mode the gateway refuses to start with auth disabled (no keys ⇒ every
  # request is ANONYMOUS with full access). For a trusted local network only, set
  # allow_anonymous: true to override. Embedded mode keeps the permissive single-operator default.
  allow_anonymous: false
  # rbac:
  #   - name: ops-dashboard
  #     key: "change-me-viewer-token"
  #     role: viewer
  #   - name: admin-cli
  #     key: "change-me-admin-token"
  #     role: admin
  #
  # ANY entry may hold its key by REFERENCE instead of as a literal, and in Kubernetes it
  # should: this file is mounted from a ConfigMap, so a literal here is a live bearer
  # credential that `kubectl get configmap` prints. A secret:// key is resolved through the
  # credential store (needs gateway.credentials.root / MCP_CREDENTIAL_ROOT), and a reference
  # that cannot be resolved REFUSES TO START rather than being dropped — a silently absent
  # entry shows up as unexplained 401s for whoever holds it.
  #
  #   - name: bff-password-sessions
  #     key: "secret://t-3f9a1c2b7d4e8065/console/bff#token"
  #     role: console
  #
  # `console` is the role for the UI's BFF relaying a PASSWORD session (one with no per-user
  # token to pass through). It is operator + caller — device management, metrics, and tool
  # invocation — and deliberately carries NO backup:* scope: an admin key here would make
  # one relayed request a complete credential dump. Unflagged on purpose; this is continuous
  # machine traffic, not break-glass.
  #
  # BREAK-GLASS entries (ADR-0023). Add `break_glass: true` to an entry and it stops being
  # an ordinary static key: it is one individually-generated, individually-held credential
  # per authorized person, so a break-glass action is attributable to a human rather than to
  # "the admin key". Ordinary entries above are untouched — CI keys and machine credentials
  # should NOT be flagged, or routine automation becomes noisy for no security benefit.
  #
  # A flagged entry is held to two rules, and the gateway REFUSES TO START if either is
  # broken. There is no allow_... override, deliberately: a misconfigured break-glass entry
  # is not a weaker working one, it is one the audit cannot name.
  #
  #   1. `name` is MANDATORY. Without it the audit subject falls back to the role, so two
  #      people holding two different credentials would both appear as "key:admin" — the
  #      shared-anonymous-credential problem this flag exists to close, arriving through an
  #      omitted field instead of a shared key.
  #   2. `key` is a secret:// REFERENCE, never a literal. A literal fails "never in
  #      configuration" however carefully the value was generated: the document still
  #      carries the credential. Requires gateway.credentials.root (or MCP_CREDENTIAL_ROOT).
  #
  # rbac:
  #   - name: alice
  #     break_glass: true
  #     key: "secret://t-3f9a1c2b7d4e8065/break-glass/alice#key"
  #     role: admin
  #   - name: bob
  #     break_glass: true
  #     key: "secret://t-3f9a1c2b7d4e8065/break-glass/bob#key"
  #     role: admin
  #     issued: "2026-08-22"
  #
  #   3. `issued` is MANDATORY (YYYY-MM-DD) and is the date the key was generated. A flagged
  #      credential carries a real lifetime; an entry with no issue date has indefinite
  #      validity, which is what the lifetime rule exists to prevent. A date in the FUTURE is
  #      also refused — the likeliest cause is a typo in the year, and it silently grants
  #      extra lifetime.
  #
  # Lifetime defaults to 90 days and is tunable. Warnings escalate at 14 days and again at 3
  # days before expiry, so it is never discovered dead during the incident it exists for.
  # break_glass_expiry_days: 90
  #
  # AN EXPIRED CREDENTIAL STOPS WORKING; IT DOES NOT STOP THE GATEWAY. The key is dropped and
  # logged loudly, and everything else keeps serving — refusing to boot would turn a
  # credential-hygiene lapse into an outage of the very mechanism that exists for outages.
  # Note that dropping the last key does NOT re-enable the no-auth single-operator path:
  # requests are refused with 401, never served anonymously.
  #
  # Deliver each key out of band TO THAT ONE PERSON. A shared team vault holding both makes
  # the audit record "alice" when it was Bob using Alice's key — attributable in form, wrong
  # in fact. ADR-0023 property 1 requires that custody be verified, not documented.
  #
  # EVERY USE IS LOUD. A request authenticated with a flagged credential emits a dedicated
  # `auth.break_glass` audit record (severity=high, logged at WARNING), distinct from ordinary
  # static-key authentication so it cannot read as unremarkable in the request log.
  #
  # On top of that, an ACTIVATION — a use that follows a quiet gap — emits
  # `auth.break_glass.activated` (severity=critical, ERROR) and increments
  # mcp_break_glass_activations_total. That is the notification trigger; alert on the metric
  # (deploy/kubernetes/prometheus-rules.yaml ships the rules). Working an incident for hours
  # is ONE activation however many calls it takes — notifying per request would bury the
  # signal during exactly the incident it exists to announce.
  #
  # NOTHING HERE EVER BLOCKS. Reactivation frequency raises a review flag and nothing else: a
  # call budget that cut off a legitimate incident response mid-session is the one failure a
  # break-glass mechanism cannot afford. The tell worth watching is not call volume, it is a
  # credential reactivating week after week — that means normal work is reaching for the
  # emergency path and needs its own credential.
  # break_glass_session_gap_minutes: 60   # quiet gap after which the next use is a new activation
  # break_glass_review_window_days: 30    # trailing window the activations are counted over
  # break_glass_review_threshold: 3       # more activations than this in the window → review flag
  # Federated identity (OIDC) — ADR-0007. When enabled, a request bearing a JWT is
  # validated against the IdP's JWKS and mapped to scopes via group_roles below; an
  # opaque token still falls back to the static keys above. KEEP at least one admin key
  # as break-glass: if the IdP/JWKS is unreachable, OIDC fails closed but static keys
  # keep working. See docs/rbac-roles.md and docs/threat-model-identity.md.
  # oidc:
  #   enabled: true
  #   issuer: "https://login.example.com/realms/corp"   # ADFS / Entra / Okta / Keycloak …
  #   audience: "device-mcp-gateway"                      # must equal the JWT 'aud'
  #   # jwks_uri is auto-discovered from <issuer>/.well-known/openid-configuration; set
  #   # it explicitly to skip discovery (e.g. air-gapped):
  #   # jwks_uri: "https://login.example.com/realms/corp/protocol/openid-connect/certs"
  #   groups_claim: "groups"        # claim carrying IdP group membership
  #   subject_claim: "sub"          # claim used as the audit subject
  #   algorithms: ["RS256"]         # asymmetric allow-list (HS*/none refused)
  #   leeway: 60                    # clock-skew tolerance, seconds
  #   jwks_cache_ttl: 600           # how long a fetched key set is trusted, seconds
  #   jwks_min_refresh_interval: 30 # rate-limit on kid-miss refetch, seconds
  #   group_roles:                  # IdP group → gateway role (a scope bundle)
  #     mcp-admins: admin
  #     mcp-operators: operator
  #     mcp-viewers: viewer
  #     mcp-auditors: auditor
  #
  # Trusting a SECOND issuer. The `issuers` list replaces the single-issuer keys above;
  # setting both is refused at startup so there is never a question which mapping applies.
  # Everything else is per-entry.
  #
  # group_roles is PER ISSUER with no shared or fallback mapping: an unmapped
  # (issuer, group) pair grants nothing. Kept flat across two issuers it would be a
  # privilege-escalation primitive — a tenant's own IdP admin creates a group named
  # whatever the other mapping keys on, adds themselves, and their own gateway hands
  # them the other issuer's scopes.
  #
  # issuers:
  #   - issuer: "https://login.example.com/realms/corp"
  #     audience: "device-mcp-gateway"
  #     group_roles:
  #       mcp-admins: admin
  #       mcp-viewers: viewer
  #   - issuer: "https://second-idp.example.com"
  #     audience: "device-mcp-gateway"
  #     group_roles:
  #       support-engineers: operator
  #
  # ⚠️ REMOVED (2026-08-20, PR #139): the ADR-0013 provider plane — `plane`, its scope
  # ceiling, `step_up_acr`, `grant_claim`, `entitlement_claim` and the single-use elevated
  # grants. ADR-0017 supersedes that arrangement. Multi-issuer trust itself was KEPT as a
  # neutral capability, which is what the example above still shows.
  #
  # Those keys are now IGNORED, not refused. That matters: a config carried over from an
  # older deployment will start cleanly and silently enforce none of what it describes —
  # in particular there is no longer a provider scope ceiling, so a group mapped to a role
  # gets that role's full scopes. Delete them.

  # Fernet key for encrypting device credentials in SQLite.
  # Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # Override with MCP_SECRET_KEY environment variable.
  # Leave empty to store credentials as plaintext (not recommended for production).
  secret_key: ""
  # Key rotation (F-34): to rotate without downtime, list multiple keys with the NEW
  # key first and the OLD key(s) after. New writes use the first key; all keys can
  # decrypt. Deploy with both keys, run `device-mcp-rotate-secrets` to re-encrypt every
  # stored credential under the new key, then drop the old key. MCP_SECRET_KEY may also
  # carry several keys, comma-separated ("<new>,<old>"). Takes precedence over secret_key.
  # secret_keys:
  #   - "<new-fernet-key>"
  #   - "<old-fernet-key>"
  # Distributed mode persists device credentials to Redis. By default the gateway
  # and workers REFUSE to start in distributed mode without a secret_key so
  # credentials are never written in plaintext. Set true to override (dev only).
  allow_plaintext_credentials: false
  # Distributed mode refuses to start on a static API key that is under 16 characters or a
  # common guessable value (admin, changeme, ...). These are full bearer credentials, and
  # with OIDC enabled the same key is the break-glass path that still works when the IdP is
  # down. Embedded mode only warns, so local dev is unaffected. Generate a real key with
  # `openssl rand -hex 32`. Set true to override (trusted local network only).
  allow_weak_keys: false
  # Maximum POST/PUT request body size in bytes (default 1 MB). Requests exceeding this return 413.
  max_body_bytes: 1048576
  # Seconds to cache the /admin/overview read aggregate per replica, so a polling
  # UI dashboard doesn't trigger a fresh device list on every request. The response
  # carries an ETag for conditional (304) requests. Set 0 to disable caching.
  read_cache_ttl: 5
  # Trust X-Forwarded-For for the rate-limiter client IP. Enable ONLY when the
  # gateway sits behind a trusted proxy/ingress that sets this header, otherwise
  # clients can spoof it. When false, the limiter keys on the socket peer IP.
  # In distributed mode rate limits are shared across replicas via Redis
  # automatically; in embedded mode they are per-process.
  # REQUIRES security.trusted_proxy_cidrs when true — the gateway refuses to start
  # with this enabled and no trusted ranges, because proxies APPEND to
  # X-Forwarded-For, so without knowing which hops are yours the client controls
  # the header and can choose its own rate-limit bucket.
  trust_proxy_headers: false

server:
  # 0.0.0.0 binds all interfaces (intended for containers behind a network policy/LB).
  # The gateway warns at startup if it binds all interfaces while auth is disabled —
  # bind 127.0.0.1 for a local-only process, or configure auth (see gateway.api_key).
  host: "0.0.0.0"
  port: 8000

registry:
  # "embedded": in-process pods, SQLite, no Redis required (default, local dev)
  # "distributed": Redis-backed registry + separate worker processes (production)
  # Override with the MCP_REGISTRY_MODE environment variable. The gateway and
  # workers must agree on this; a worker refuses to start unless it resolves to
  # "distributed".
  mode: "embedded"
  # How often to poll device reachability (seconds)
  health_check_interval: 30
  # How often to check for spec version updates
  spec_poll_interval: 300
  # Spec cache TTL in seconds
  spec_cache_ttl: 3600
  # Max devices one fleet session (/v1/fleet/sse?devices=...) may span
  fleet_max_devices: 25
  # Max OpenAPI spec body size in bytes (F-09). A fetched spec larger than this is
  # rejected before it is parsed, cached, or translated, so a hostile/huge document
  # can't exhaust memory or starve the shared spec-translation process pool.
  spec_max_bytes: 5000000
  # Wall-clock seconds a single spec translation may hold a pool worker (F-09). On
  # timeout the spec is rejected and the awaiting health/registry loop is freed.
  spec_translate_timeout: 15
  # Embedded mode: seconds POST/PUT /devices waits inline for a device to finish
  # provisioning (reachability + spec discovery + pod spawn) before returning and
  # letting it finish in the background (F-11). A fast/healthy device returns ready;
  # a slow/unreachable one returns promptly with "provisioning": true. Set 0 to
  # always return immediately (fully async registration).
  registration_provision_budget: 8
  # Distributed mode: seconds the gateway waits for a worker to handle a tool
  # call before emitting a timeout error event on the SSE stream, so clients
  # don't hang forever when no worker is consuming.
  tool_call_timeout: 30
  # Distributed mode: how often the leader-elected reconciler sweeps for orphaned
  # devices (claim lease lapsed because the owning worker died) and republishes
  # their assignments so a live worker takes over. One worker leads at a time.
  reconcile_interval: 30
  # Distributed mode: lease-flap hysteresis (F-62). A device whose claim lease has
  # lapsed is treated as orphaned (its owner died) — but a GC pause / Redis stall /
  # network blip longer than the claim TTL can lapse a HEALTHY worker's claim and get
  # it wrongly reassigned (transient double-pod churn). The reconciler must observe a
  # device orphaned across this many CONSECUTIVE leader sweeps before reassigning, so
  # a single transient lapse self-heals on the owner's next heartbeat. This adds
  # ~grace × reconcile_interval of margin on top of the claim TTL. 1 = no hysteresis
  # (reassign on the first missed sweep). Watch mcp_reconciler_reassignments_total —
  # a sustained rate means leases are flapping; raise this or the claim TTL.
  reconcile_orphan_grace_cycles: 2
  # Distributed mode: path to the local file the worker touches on every healthy
  # heartbeat, checked by a cheap K8s exec liveness probe (F-17). Defaults to
  # <system-temp-dir>/mcp-worker-alive. If you override this, update the probe
  # command in worker-deployment.yaml to match.
  # liveness_file: /var/run/mcp-worker-alive
  # Distributed mode: periodic load rebalancing on scale-out (F-07). Each worker
  # sheds devices above the per-worker target (ceil(total_devices / live_workers))
  # so a newly added/idle worker actually picks up load instead of early workers
  # staying hot. Sheds are paced by reconcile_interval. Set false to pin devices to
  # their first owner (no rebalancing).
  rebalance_enabled: true
  # Distributed mode: idempotency guard (F-08). At-least-once stream delivery means
  # a reclaimed call (a worker died/shed the device with calls in its PEL) can re-run
  # an operation that already executed. With this on, a non-idempotent call (POST/PATCH)
  # runs at most once across the fleet — a redelivery after a prior attempt began is
  # refused with a duplicate_suppressed error instead of double-applying. Idempotent
  # methods (GET/PUT/DELETE/…) are still retried freely. Set false to allow
  # at-least-once for every method (only safe if your upstreams dedupe writes).
  idempotency_guard: true
  # Distributed mode: max concurrent in-flight tool calls a worker runs per device.
  # When saturated the worker stops reading that device's call stream (backpressure),
  # so a burst shows up as Redis-stream lag rather than unbounded worker memory.
  max_concurrent_calls_per_device: 20
  # Distributed mode: aggregate cap on concurrent in-flight tool calls across ALL
  # devices a worker hosts (F-13). The per-device cap above bounds a single device;
  # this bounds the worker as a whole, so a worker owning many devices can't run
  # devices × max_concurrent_calls_per_device calls at once on its one shared event
  # loop and HTTP pool. When saturated, dispatches wait (the burst becomes Redis-stream
  # lag) and mcp_worker_calls_throttled_total increments. Keep ≥ the per-device cap.
  max_concurrent_calls_per_worker: 200
  # Distributed mode: admission watermark (F-06). When a device's call stream has
  # this many undelivered calls (consumer-group lag), the gateway fast-fails new
  # tool calls with HTTP 429 instead of queuing behind work that would be silently
  # trimmed at the stream's MAXLEN (10k) and surface only as a 30s client timeout.
  # Set 0 to disable admission shedding. Keep well below MAXLEN.
  call_backlog_limit: 1000
  # Distributed mode: on SIGTERM, seconds to let in-flight tool calls finish before
  # cancelling them. Keep below the pod terminationGracePeriodSeconds.
  shutdown_drain_timeout: 25
  # Per-device health-check lock TTL in seconds (distributed mode). Must exceed
  # the worst-case single check (reachability + spec fetch + translation) so a
  # slow check can't let the lock expire and a second worker double-check the
  # same device. Defaults to max(2 × health_check_interval, 120) when unset.
  # health_lock_ttl: 120
  # Max pods to run concurrently (embedded mode only)
  max_concurrent_pods: 50
  # Bounded retries with full-jitter backoff on IDEMPOTENT outbound calls only —
  # GET tool calls, reachability and spec/discovery fetches (F-05). POST/PUT/PATCH/
  # DELETE are never auto-retried (a timed-out mutation may already have applied).
  # On a 429 the upstream's Retry-After is honored, capped at retry_max_delay; if it
  # asks for longer, the 429 is surfaced instead of holding the call open (F-44).
  # Keep the budget small so a struggling upstream isn't amplified.
  max_retries: 2
  retry_base_delay: 0.2
  retry_max_delay: 5.0

redis:
  # Redis connection URL. Used when registry.mode = "distributed".
  # Override with MCP_REDIS_URL environment variable.
  # Redis is the entire distributed control plane (registry, tool-call streams, claims,
  # leader locks). Distributed mode REQUIRES an authenticated Redis: the URL must carry a
  # password — redis://:<password>@host:6379/0 — and ideally TLS (rediss://...). The gateway
  # and workers refuse to start against an unauthenticated Redis. For a trusted local network
  # only, set allow_insecure: true to override.
  url: "redis://localhost:6379/0"
  allow_insecure: false
  socket_timeout: 5
  # Command connection pool size per gateway/worker process.
  max_connections: 20
  # Separate pool for SSE pub/sub subscriptions. Each open SSE stream holds one
  # connection for its lifetime, so this caps concurrent SSE clients per gateway
  # replica — size it to your expected concurrency (not shared with commands).
  pubsub_max_connections: 1000

  # --- Failover resilience ---
  # These are what make an HA Redis actually highly available to the gateway. Without
  # them a primary failover reaches callers as a burst of hard ConnectionErrors instead
  # of a transparent reconnect, no matter how well the Redis side is built.
  #
  # Retry attempts for a command that hits a connection error or timeout, with JITTERED
  # exponential backoff (base 50ms, cap 1s) — so 5 retries spend up to ~2.5s worst case.
  # Jitter matters because a failover hits every replica and worker at the same instant;
  # without it they all retry in lockstep and hammer the newly promoted primary.
  # This is sized to absorb the reconnect burst and a SHORT election — not to block
  # through a long Sentinel promotion, which can take tens of seconds. Blocking a request
  # that long is worse than failing it and letting the caller retry; raise this if your
  # election is slower and you would rather wait.
  # Set 0 to disable retrying and see every failure immediately (debugging).
  # NOTE: a retry can run a command twice if the failure landed after the server
  # executed it but before the reply arrived. That is safe here — the rate-limit INCR
  # only over-counts (fails closed), and dispatch writes are covered by
  # registry.idempotency_guard. A permanent outage still surfaces; the budget is finite.
  retries: 5
  # Seconds between PINGs on idle pooled connections. A connection left half-open by a
  # failover is otherwise only discovered when a real command fails on it, so every
  # idle connection would fail once after each failover. Set 0 to disable.
  health_check_interval: 30
  # Seconds to wait for the TCP connect itself. Without a bound, a vanished primary
  # hangs on the OS default (often ~2 minutes) — far longer than the failover.
  socket_connect_timeout: 5

  # --- Startup ---
  # Seconds to wait at process start for Redis to become reachable, retrying with
  # jittered backoff. This is NOT the same job as `retries` above: that budget is
  # deliberately short because a request caught mid-failover should fail fast rather
  # than block a caller. At startup nobody is waiting on a response, and the usual
  # reason Redis is unreachable is that it simply hasn't finished starting — start
  # order is not guaranteed on any orchestrator.
  # Exceeding this is still a hard failure with a non-zero exit, so a genuinely dead
  # Redis reaches your probes and alerts. Set 0 to fail on the first attempt instead.
  startup_timeout: 60

auth:
  # Default auth type (api_key or oauth2)
  type: "api_key"
  
  # API Key mode settings
  api_key:
    header_name: "X-API-Key"
    
  # OAuth2 mode settings
  oauth2:
    token_endpoint: ""
    client_id: ""
    client_secret: ""
    scopes:
      - "read"
      - "write"
      
discovery:
  # How the gateway finds a device's tool set. For upstream_kind "openapi" that means
  # fetching a spec (spec_url, or these paths tried in order); for upstream_kind "mcp"
  # there is nothing to discover — the tool set comes from the upstream's tools/list —
  # so only `timeout` applies there, bounding the handshake and the list call.
  # Common OpenAPI spec paths to try when auto-discovering
  spec_paths:
    - "/openapi.json"
    - "/openapi.yaml"
    - "/swagger.json" 
    - "/swagger.yaml"
    - "/api-docs"
    - "/docs/openapi.json"
    - "/openapi/3.0.json"
    - "/api/v1/openapi.json"
  # Timeout for discovery requests (seconds)
  timeout: 10

storage:
  # Persistence backend: sqlite
  type: "sqlite"
  # Path to the SQLite database file
  db_path: "./data/devices.db"

cors:
  # Allowed origins for browser-based MCP clients. Empty list disables CORS headers (safe default).
  # Credentials are allowed, so a "*" wildcard lets ANY website call the API from a browser —
  # the gateway warns at startup if you set it. Use ["*"] only in local development; set specific
  # origins in production. Example: ["https://my-llm-app.example.com", "https://app.anthropic.com"]
  allowed_origins: []

security:
  # SSRF policy (Tier-0 F-02). Applies to EVERY URL the gateway fetches server-side, which
  # is more than devices: device base_url/spec_url, and also the OIDC issuer, an explicit
  # gateway.oidc.jwks_uri, and the JWKS fetch itself (TM-I-10). By default the gateway
  # refuses targets resolving to internal/loopback/link-local/private addresses (e.g. cloud
  # metadata at 169.254.169.254). Set true ONLY for a trusted internal deployment — devices
  # on private addresses, or an on-premises IdP.
  #
  # ⚠️ For OIDC this is checked at STARTUP, not on the first login. An on-prem IdP on a
  # private address makes the gateway REFUSE TO START, naming the field it rejected —
  # it does not look like a login problem, because no login has happened yet.
  #
  # Not the same thing as allow_plaintext_idp below, and deliberately not one flag: this
  # one is about WHERE a target is, that one about whether the connection is encrypted.
  # Env override: MCP_ALLOW_PRIVATE_TARGETS=true.
  allow_private_targets: false

  # TM-I-05: accept a plaintext http:// OIDC issuer (or jwks_uri). Default false — the
  # gateway REFUSES TO START on one, because the IdP's signing keys and every access token
  # would cross the network unencrypted and an on-path attacker could substitute either.
  # Deliberately separate from allow_private_targets above: where an IdP sits and whether
  # it speaks TLS are independent, and the SSRF guard permits http by design. There is no
  # localhost exemption — a silent carve-out cannot be warned about. Set true only for a
  # lab or air-gapped deployment; it is warned about loudly at startup when set.
  allow_plaintext_idp: false

  # Which ports a server-side fetch may use — device target URLs, and equally the OIDC
  # issuer and JWKS endpoint (see allow_private_targets above; the same policy covers both).
  # EMPTY (the default) does NOT mean "any port":
  # it means the built-in denylist applies, refusing ports that carry a non-HTTP protocol —
  # 22 SSH, 23, 25/465/587 SMTP, 53, 110/143/993/995 mail, 135/139/445 SMB, 389/636 LDAP,
  # 1433, 2049, 3306, 3389, 5432, 5900, 6379 Redis, 11211, 27017 — plus 2375/2376, which
  # are HTTP but expose the Docker daemon (a direct RCE pivot). The gateway only ever
  # speaks HTTP to a device, so aiming it at those can only be a port scan or an attempt
  # to smuggle a payload into another protocol.
  #
  # Ordinary HTTP ports stay open by default, including non-standard ones (8000, 8080,
  # 8443) — a device fleet legitimately lives there.
  #
  # Setting a non-empty list switches to a STRICT ALLOWLIST that replaces the denylist:
  # only these ports are permitted, and you can deliberately re-open a denylisted one.
  #   allowed_target_ports: [80, 443]            # tightest posture
  #   allowed_target_ports: [80, 443, 8080]      # ...plus one known fleet port
  #
  # ⚠️ Remember the IdP when tightening this. An allowlist chosen for a device fleet will
  # also refuse an IdP on a port outside it — at startup, as above. An IdP on 9000 (or any
  # other non-listed port) needs its port here too.
  allowed_target_ports: []

  # Address ranges your reverse proxies / load balancers connect FROM — the required
  # companion to gateway.trust_proxy_headers (enabling that with this empty is refused
  # at startup). Both IPv4 and IPv6 ranges are accepted; a bare address means that one
  # host (10.0.0.5 == 10.0.0.5/32).
  #
  # X-Forwarded-For is resolved by walking the header RIGHT-to-left, starting from the
  # TCP peer and popping entries while each hop falls inside these ranges; the first hop
  # outside them is the client. That is why the list must contain only infrastructure you
  # control: every range added here is a hop an attacker no longer has to get past. Listing
  # something too broad (0.0.0.0/0, or a shared cloud range) re-opens the spoofing hole,
  # because the walk will consume the attacker's own forged entries as if they were yours.
  #
  # Examples:
  #   ingress-nginx / k8s — the pod CIDR the ingress controller runs in, plus the LB range:
  #     trusted_proxy_cidrs: ["10.244.0.0/16", "10.96.0.0/12"]
  #   docker-compose — the compose bridge network the proxy container sits on
  #   (default bridge pool is 172.16.0.0/12; check `docker network inspect <net>` if you
  #   overrode it in daemon.json or with an explicit `ipam` block):
  #     trusted_proxy_cidrs: ["172.16.0.0/12"]
  #   single host-local reverse proxy (nginx/caddy on the same box):
  #     trusted_proxy_cidrs: ["127.0.0.1/32", "::1/128"]
  trusted_proxy_cidrs: []

  # Outbound mutual-TLS to devices (F-31). When set, every outbound HTTPS call to a
  # device — tool calls, reachability probes, spec fetches, health checks — presents
  # this client certificate and/or verifies the device's server certificate against
  # the given CA. Omit the whole block for default behaviour (anonymous client, public
  # CA verification via certifi). The keys below are the FLEET default; the `devices`
  # sub-block overrides them for one device. See docs/security-mtls.md.
  # mtls:
  #   client_cert: /etc/mcp/tls/client.crt      # PEM client cert (may also contain the key)
  #   client_key: /etc/mcp/tls/client.key       # PEM private key (omit if combined into client_cert)
  #   client_key_password: ""                   # prefer env MCP_TLS_CLIENT_KEY_PASSWORD over config
  #   ca_bundle: /etc/mcp/tls/device-ca.pem     # verify device server certs against THIS CA (replaces public set)
  #   verify: true                              # set false ONLY on a trusted closed test network — disables verification
  #
  #   # Per-device overrides, keyed by the hostname the device is registered under.
  #   # A device with no block here inherits everything above, so adding this section
  #   # changes nothing for the devices it does not name. Use it instead of setting
  #   # `verify: false` at the fleet level — that turns verification off for EVERY
  #   # device, including the ones whose certificates are fine.
  #   devices:
  #     unifi.example.internal:
  #       verify: false                         # this device only; the rest keep verifying
  #     switch-a.example.internal:
  #       ca_bundle: /etc/mcp/tls/vendor-a-ca.pem       # a different vendor PKI
  #       client_cert: /etc/mcp/tls/vendor-a-client.crt # ...and a different identity to it
  #       client_key: /etc/mcp/tls/vendor-a-client.key
  #
  #   # Both processes REFUSE TO START on a bad profile here: an unreadable file, or an
  #   # unknown key inside a device block (a misspelt `ca-bundle` would silently leave
  #   # that device on the fleet trust set, which looks exactly like success).

backup:
  # Backup and restore (ADR-0011). Two archive kinds: "ciphertext" (the default —
  # credentials stay encrypted under this stack's MCP_SECRET_KEY) and "portable"
  # (re-encrypted to a caller-supplied passphrase, for migrating to a stack with a
  # different key). An archive NEVER contains MCP_SECRET_KEY itself — back that up
  # out-of-band, or a portable archive is your only route back.
  #
  # Minimum passphrase length accepted for a portable export. Recorded in the
  # envelope, so an archive says what floor it was made under.
  passphrase_min_length: 16
  # Argon2id parameters for passphrase -> key. These are written INTO each portable
  # archive's envelope and the reader uses the envelope's values, not these — so
  # raising the cost later hardens new archives without orphaning existing ones.
  argon2_memory_cost_kib: 65536   # 64 MiB
  argon2_iterations: 3
  argon2_lanes: 4
  # Max dead-letter entries archived per device when include_deadletters=true.
  # Dead letters are opt-in: valuable mid-incident, unbounded noise otherwise.
  deadletter_limit: 1000

metrics:
  # Prometheus exposition is served on a DEDICATED port, separate from the API
  # port — point a ServiceMonitor / scrape config at this port (named "metrics"),
  # and restrict it with a NetworkPolicy rather than exposing it via the API LB.
  # Run one process per pod (scale via replicas); no multiprocess mode required.
  enabled: true
  # Metrics port (env MCP_METRICS_PORT overrides). Workers reuse the same key.
  port: 9100
  # Seconds between device-fleet gauge refreshes (registered/active/reachable).
  gauge_refresh_interval: 15
  # Optional bearer token gating the exposition endpoint (F-36; env MCP_METRICS_TOKEN
  # overrides). When set, scrapers must send `Authorization: Bearer <token>` (point the
  # Prometheus scrape config at a secret-backed bearer_token_file). When unset (default),
  # the endpoint is open and must be restricted with a NetworkPolicy.
  # auth_token: "change-me"

# Optional distributed tracing (OpenTelemetry → OTLP/HTTP). OFF by default and a
# no-op unless the [otel] extra is installed (pip install '.[otel]'). When on, a
# tool call is one trace across gateway → Redis → worker; the request id (rid) is
# attached as a span attribute. F-14.
tracing:
  enabled: false
  # OTLP/HTTP traces endpoint of your collector (e.g. an OTel Collector sidecar).
  otlp_endpoint: "http://localhost:4318/v1/traces"
  # service.name reported to the collector. The gateway/worker append their role.
  service_name: "device-mcp-gateway"
  # Head sampling ratio 0.0–1.0 (1.0 = sample every trace).
  sample_ratio: 1.0

logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # Log file path (rotated; tailed by Fluent Bit / Splunk UF / Promtail)
  file: "logs/gateway.log"
  # Max log file size in MB before rotation
  max_size: 50
  # Number of rotated backup files to retain
  backup_count: 5
  # Emit log file as newline-delimited JSON (recommended for external collectors).
  # Set to false only for local development without an observability stack.
  json_logs: true
  # Dedicated tamper-evident audit stream (F-57/F-58). Only event="audit" records
  # land here, always JSON, hash-chained so any edit/deletion/reorder is detectable
  # offline via `python -m device_mcp_gateway.audit_verify <file>`. Forward this file
  # to an append-only SIEM/WORM store for end-to-end tamper-evidence. Each process
  # must own its own audit file (the worker uses logs/worker-audit.log).
  audit_file: "logs/audit.log"
  # Time-based retention for the audit stream (F-58), e.g. "90 days", "7 years".
  # For legal hold, raise this (or set audit_enabled and ship to a retained sink) —
  # see docs/audit-logging.md for the retention/legal-hold/disposal policy.
  audit_retention: "90 days"
  # Set false to disable the dedicated audit sink (records still appear in the main log).
  audit_enabled: true
