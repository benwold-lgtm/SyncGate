[build-system]
requires = ["setuptools>=68.0", "wheel>=0.38.0"]
build-backend = "setuptools.build_meta"

[project]
name = "device-mcp-gateway"
version = "0.3.9"
description = "Universal API-to-MCP Gateway - Translates OpenAPI specs to MCP servers"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [
    {name = "Ben Wold", email = "benwold@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "openapi-spec-validator>=0.5.9",
    # Upper-bound the ASGI/routing stack. `metrics.route_template` reads Starlette
    # routing internals (scope["route"]/scope["endpoint"]), and a Starlette *minor*
    # (1.2→1.3) silently changed scope["endpoint"] identity — mislabeling every HTTP
    # metric as route="__unmatched__", surfacing only once CI freshly installed the new
    # version. Pin the minor so a routing-internals change can't land unattended in CI
    # *or* a Docker rebuild; bump deliberately and re-run the route_template guard
    # (tests/test_metrics.py::test_parametrised_route_uses_template_not_concrete_path).
    "fastapi>=0.104.1,<0.138",
    "starlette>=1.2,<1.4",
    "uvicorn[standard]>=0.24.0",
    # Major-capped (see tests/test_requirements.py::test_critical_deps_exclude_the_next_major):
    # these carry enough load-bearing API surface that a major bump must be a deliberate,
    # tested change rather than something a clean `pip install -e .` picks up on its own.
    "pydantic>=2.5.2,<3.0.0",
    "httpx>=0.25.2",
    "sse-starlette>=1.8.2",
    "PyJWT>=2.8.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "anyio>=4.2.0",
    "aiosqlite>=0.19.0",
    "cryptography>=44.0.0,<50.0.0",
    "redis[asyncio]>=5.0,<9.0.0",
    "pybreaker>=1.2",
    "prometheus-client>=0.20",
    "jsonschema>=4.20"
]

[project.optional-dependencies]
# The formatter and linters are BLOCKING CI gates (`black --check` fails the build), so an
# unbounded spec means an upstream major release can turn an unrelated PR red overnight —
# a new black release reformats, a new flake8/mypy adds a rule, and CI goes red with no
# change from us. Upper-bounded at the next major above what is verified working, so
# adopting a new major is a deliberate PR that updates these bounds. See
# tests/test_requirements.py::test_ci_gating_dev_tools_exclude_the_next_major.
dev = [
    "pytest>=7.4.3,<10.0.0",
    "pytest-asyncio>=0.21.1,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "black>=23.12.1,<27.0.0",
    "flake8>=6.1.0,<8.0.0",
    "mypy>=1.8.0,<3.0.0",
    "pre-commit>=3.5.0",
    # 2.37.1 is the floor, not a preference: earlier versions do not honour
    # `decode_responses=True` for hash and stream replies, which had put defensive
    # byte-decoding into FOUR pieces of production code to accommodate a test double.
    # CI floated to 2.37.1 while a local venv sat on 2.36.0, and the two disagreed about
    # the behaviour that code depended on. See TG-6 in docs/testing-gaps.md.
    "fakeredis>=2.37.1,<3.0.0",
    # Used by tests/test_requirements.py to evaluate dependency specifiers against
    # the pip-compiled lockfile. Declared rather than leaned on as a pytest transitive.
    "packaging>=23.0",
    # The official MCP SDK is a TEST dependency, not a runtime one. The gateway speaks MCP
    # through its own JSON-RPC router (pods/pod_base.py) and its own upstream client
    # (upstream/mcp_client.py); the only runtime import was a `FastMCP` instance nothing
    # dispatched through, deleted when moving to 2.x. It stays here as the reference
    # implementation the interop tests check us against — an implementation nobody here
    # wrote (docs/roadmap-protocol-2026-07-28.md, trap 1). The image installs
    # requirements.txt, which therefore does not carry it;
    # tests/test_requirements.py::test_gateway_does_not_import_the_mcp_sdk keeps it that way.
    # 2.3.0 is the floor because it is the first release verified here; the major is capped
    # for the same reason as the tools above.
    "mcp>=2.3.0,<3.0.0"
]
# Optional distributed tracing (F-14). Install with: pip install '.[otel]'
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
device-mcp = "device_mcp_gateway.cli:main"
device-mcp-worker = "device_mcp_gateway.cli:worker_main"
device-mcp-rotate-secrets = "device_mcp_gateway.cli:rotate_secrets_main"

[tool.setuptools.packages.find]
include = ["device_mcp_gateway*"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: tests that require a real Redis (skipped if MCP_REDIS_URL is unreachable)",
]
filterwarnings = [
    "ignore::DeprecationWarning:websockets",
    "ignore:websockets.server.WebSocketServerProtocol:DeprecationWarning",
]
